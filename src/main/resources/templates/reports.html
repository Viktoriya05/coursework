<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reports</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar">
    <div class="nav-container">
        <a href="/dashboard" class="nav-brand">🏠 Family Chore Tracker</a>
        <div class="nav-menu">
            <a href="/dashboard">Dashboard</a>
            <a href="/planning">Planning</a>
            <a href="/family">Family</a>
            <a href="/reports">Reports</a>
            <a href="/review">Review</a>
            <form th:action="@{/logout}" method="post">
                <button type="submit">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <h1 style="margin-bottom: 1.5rem;">📊 Reports & Analytics</h1>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-value" th:text="${userStats.totalChoresCompleted}">0</div>
            <div class="stat-label">Tasks Completed</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" th:text="${userStats.totalHoursSpent} + 'h'">0h</div>
            <div class="stat-label">Total Time Spent</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" th:text="${userStats.totalPoints}">0</div>
            <div class="stat-label">Total Points</div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h3>📈 Weekly Summary</h3>
        </div>
        <p><strong>Week:</strong> <span th:text="${weeklyStats.weekStart} + ' - ' + ${weeklyStats.weekEnd}"></span></p>
        <p><strong>Family Total Time:</strong> <span th:text="${weeklyStats.familyTotalMinutes} + ' minutes'"></span></p>
    </div>

    <div class="card">
        <div class="card-header">
            <h3>👨‍👩‍👧 Family Time Distribution</h3>
        </div>
        <div th:each="entry : ${weeklyStats.userTotalMinutes}" class="task-item">
            <div><strong th:text="${entry.key}"></strong></div>
            <div><span class="task-points" th:text="${entry.value} + ' min'"></span></div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h3>📂 Time by Category</h3>
        </div>
        <div th:each="entry : ${userStats.categoryTimeMap}" style="margin-bottom: 1rem;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 0.25rem;">
                <span th:text="${entry.key}"></span>
                <span th:text="${entry.value} + ' min'"></span>
            </div>
            <div style="background: #E2E8F0; border-radius: 10px; height: 8px; overflow: hidden;">
                <div style="background: linear-gradient(90deg, #A8E6CF, #B5EAD7); border-radius: 10px; height: 100%; width: 0%;"
                     th:style="'width: ' + (${entry.value} * 100 / ${userStats.totalMinutesSpent}) + '%'"></div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
