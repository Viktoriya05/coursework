<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Family Chore Tracker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>🏠 Family Chore Tracker</h1>
            <p>Track chores, earn points, manage family tasks</p>
        </div>

        <div th:if="${param.error}" class="alert alert-danger">
            Invalid username or password
        </div>
        <div th:if="${param.logout}" class="alert alert-success">
            You have been logged out successfully
        </div>
        <div th:if="${param.registered}" class="alert alert-success">
            Registration successful! Please login.
        </div>

        <form method="post" th:action="@{/login}" class="auth-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a href="/register">Register here</a></p>
        </div>
    </div>
</div>
</body>
</html>
