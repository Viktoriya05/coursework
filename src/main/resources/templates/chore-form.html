<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Task - Family Chore Tracker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<nav class="navbar">
    <div class="nav-container">
        <a href="/dashboard" class="nav-brand">🏠 Family Chore Tracker</a>
        <div class="nav-menu">
            <a href="/dashboard">Dashboard</a>
            <a href="/chores">My Tasks</a>
            <a href="/planning">Planning</a>
            <a href="/family">Family</a>
            <a href="/reports">Reports</a>
            <form th:action="@{/logout}" method="post" style="display: inline;">
                <button type="submit" style="background: none; border: none; color: #f56565; cursor: pointer; font-size: 16px;">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="page-header">
        <h1>Create New Task</h1>
    </div>

    <div class="card" style="max-width: 600px;">
        <form method="post" th:action="@{/chores/create}" th:object="${chore}">
            <div class="form-group">
                <label for="name">Task Name *</label>
                <input type="text" id="name" th:field="*{name}" required 
                       placeholder="e.g., Clean the kitchen">
                <span th:if="${#fields.hasErrors('name')}" class="alert alert-danger" 
                      th:errors="*{name}"></span>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" th:field="*{description}" rows="3"
                          placeholder="Describe what needs to be done..."></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="points">Points</label>
                    <input type="number" id="points" th:field="*{points}" min="0" value="10">
                </div>
                <div class="form-group">
                    <label for="estimatedMinutes">Estimated Time (min)</label>
                    <input type="number" id="estimatedMinutes" th:field="*{estimatedMinutes}" 
                           min="1" placeholder="30">
                </div>
            </div>

            <div class="form-group">
                <label for="categoryId">Category</label>
                <select id="categoryId" th:field="*{categoryId}">
                    <option value="">-- Select Category --</option>
                    <option th:each="cat : ${categories}" th:value="${cat.id}" 
                            th:text="${cat.icon} + ' ' + ${cat.name}"></option>
                </select>
            </div>

            <div class="form-group">
                <label for="dueDate">Due Date</label>
                <input type="date" id="dueDate" th:field="*{dueDate}">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Create Task</button>
                <a href="/chores" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

<footer class="footer">
    <p>Family Chore Tracker &copy; 2024</p>
</footer>
</body>
</html>
