<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Tasks</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; }
        .navbar { background: #4a5568; color: white; padding: 15px 20px; }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; }
        .nav-brand { color: white; text-decoration: none; font-size: 20px; font-weight: bold; }
        .nav-menu a { color: white; text-decoration: none; margin-left: 20px; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        .card { background: white; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .btn { display: inline-block; padding: 10px 15px; background: #4299e1; color: white; text-decoration: none; border-radius: 5px; margin: 5px; border: none; cursor: pointer; }
        .btn-success { background: #48bb78; }
        .btn-warning { background: #ed8936; }
        .task-item { padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .category-badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 12px; margin-left: 10px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 20px; background: #e2e8f0; border: none; border-radius: 8px; cursor: pointer; }
        .tab-btn.active { background: #667eea; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="nav-container">
        <a href="/dashboard" class="nav-brand">🏠 Family Chore Tracker</a>
        <div class="nav-menu">
            <a href="/dashboard">Dashboard</a>
            <a href="/chores">My Tasks</a>
            <a href="/planning">Planning</a>
            <a href="/family">Family</a>
            <a href="/reports">Reports</a>
            <form th:action="@{/logout}" method="post" style="display: inline;">
                <button type="submit" style="background: none; border: none; color: #f56565; cursor: pointer; font-size: 16px;">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <h1>My Tasks</h1>
    <a href="/chores/create" class="btn">+ Create Custom Task</a>

    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('my-tasks')">My Tasks</button>
        <button class="tab-btn" onclick="showTab('default-tasks')">Available Tasks</button>
    </div>

    <!-- Мои задачи -->
    <div id="my-tasks" class="tab-content active">
        <div class="card">
            <h3>My Assigned Tasks</h3>
            <div th:each="chore : ${userChores}" class="task-item">
                <div>
                    <strong th:text="${chore.name}"></strong>
                    <span th:if="${chore.category}" class="category-badge" th:style="'background:' + ${chore.category.color} + '20; color:' + ${chore.category.color}" th:text="${chore.category.name}"></span>
                    <br>
                    <small th:text="${chore.description}"></small><br>
                    <small>⭐ <span th:text="${chore.points}">0</span> points | Status: <span th:text="${chore.status}"></span></small>
                    <small th:if="${chore.dueDate}"> | Due: <span th:text="${chore.dueDate}"></span></small>
                </div>
                <div>
                    <a th:href="'/timer?choreId=' + ${chore.id}" class="btn btn-success">▶ Start Timer</a>
                    <form method="post" th:action="@{'/chores/' + ${chore.id} + '/complete'}" style="display: inline;">
                        <button type="submit" class="btn">✓ Complete</button>
                    </form>
                </div>
            </div>
            <div th:if="${userChores.empty}">
                <p>No tasks assigned. Browse available tasks below!</p>
            </div>
        </div>
    </div>

    <!-- Доступные базовые задачи -->
    <div id="default-tasks" class="tab-content">
        <div class="card">
            <h3>Available Tasks to Add</h3>
            <div th:each="chore : ${defaultChores}" class="task-item">
                <div>
                    <strong th:text="${chore.name}"></strong>
                    <span th:if="${chore.category}" class="category-badge" th:style="'background:' + ${chore.category.color} + '20; color:' + ${chore.category.color}" th:text="${chore.category.name}"></span>
                    <br>
                    <small th:text="${chore.description}"></small><br>
                    <small>⭐ <span th:text="${chore.points}">0</span> points</small>
                </div>
                <div>
                    <form method="post" th:action="@{'/chores/assign-default/' + ${chore.id}}">
                        <button type="submit" class="btn btn-success">+ Add to My Tasks</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function showTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(tab => {
            tab.classList.remove('active');
        });
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('active');
        });
        document.getElementById(tabId).classList.add('active');
        event.target.classList.add('active');
    }
</script>
</body>
</html>
