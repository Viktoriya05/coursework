<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'Family Chore Tracker'">Family Chore Tracker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <th:block th:replace="${headContent} ?: _"></th:block>
</head>
<body>
    <nav class="navbar" sec:authorize="isAuthenticated()">
        <div class="nav-container">
            <a href="/dashboard" class="nav-brand">🏠 Family Chore Tracker</a>
            <div class="nav-menu">
                <a href="/dashboard">Dashboard</a>
                <a href="/chores">My Tasks</a>
                <a href="/planning">Planning</a>
                <a href="/family">Family</a>
                <a href="/reports">Reports</a>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" style="background: none; border: none; color: #f56565; cursor: pointer; font-size: 16px;">Logout</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container">
        <th:block th:replace="${content}"></th:block>
    </div>

    <footer class="footer" sec:authorize="isAuthenticated()">
        <p>Family Chore Tracker &copy; 2024</p>
    </footer>

    <th:block th:replace="${scripts} ?: _"></th:block>
</body>
</html>
