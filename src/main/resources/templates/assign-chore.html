<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{layout}">
<head>
    <title>Assign Task - Family Chore Tracker</title>
</head>
<body>
<div layout:fragment="content">
    <div class="page-header">
        <h1>Assign Task to Child</h1>
    </div>

    <div class="card">
        <form method="post" th:action="@{/chores/assign}">
            <div class="form-group">
                <label for="childId">Select Child</label>
                <select id="childId" name="childId" required>
                    <option value="">-- Select Child --</option>
                    <option th:each="child : ${children}" th:value="${child.id}" th:text="${child.firstName} + ' ' + ${child.lastName}"></option>
                </select>
            </div>

            <div class="form-group">
                <label for="choreId">Select Task</label>
                <select id="choreId" name="choreId" required>
                    <option value="">-- Select Task --</option>
                    <option th:each="chore : ${chores}" th:value="${chore.id}" th:text="${chore.name} + ' (⭐' + ${chore.points} + ' pts)'"></option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Assign Task</button>
                <a href="/family" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
