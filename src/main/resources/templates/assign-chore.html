<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assign Task - Family Chore Tracker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<nav class="navbar">
    <div class="nav-container">
        <a href="/dashboard" class="nav-brand">🏠 Family Chore Tracker</a>
        <div class="nav-menu">
            <a href="/dashboard">Dashboard</a>
            <a href="/chores">My Tasks</a>
            <a href="/planning">Planning</a>
            <a href="/family">Family</a>
            <a href="/reports">Reports</a>
            <form th:action="@{/logout}" method="post" style="display: inline;">
                <button type="submit" style="background: none; border: none; color: #f56565; cursor: pointer; font-size: 16px;">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="page-header">
        <h1>Assign Task to Child</h1>
    </div>

    <div class="dashboard-grid">
        <!-- Assign Existing Task -->
        <div class="card">
            <div class="card-header">
                <h3>📋 Assign Existing Task</h3>
            </div>
            <form method="post" th:action="@{/chores/assign}">
                <div class="form-group">
                    <label for="childId">Select Child</label>
                    <select id="childId" name="childId" required>
                        <option value="">-- Select Child --</option>
                        <option th:each="child : ${children}" th:value="${child.id}" 
                                th:text="${child.firstName} + ' ' + ${child.lastName} + ' (@' + ${child.username} + ')'"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="choreId">Select Task</label>
                    <select id="choreId" name="choreId" required>
                        <option value="">-- Select Task --</option>
                        <option th:each="chore : ${chores}" th:value="${chore.id}" 
                                th:text="${chore.name} + ' (⭐' + ${chore.points} + ' pts)'"></option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Assign Task</button>
            </form>
        </div>

        <!-- Create & Assign New Task -->
        <div class="card">
            <div class="card-header">
                <h3>✨ Create & Assign New Task</h3>
            </div>
            <form method="post" th:action="@{/chores/assign-new}">
                <div class="form-group">
                    <label for="childId2">Select Child</label>
                    <select id="childId2" name="childId" required>
                        <option value="">-- Select Child --</option>
                        <option th:each="child : ${children}" th:value="${child.id}" 
                                th:text="${child.firstName} + ' ' + ${child.lastName}"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="name">Task Name</label>
                    <input type="text" id="name" name="name" required 
                           placeholder="e.g., Clean your room">
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="2"
                              placeholder="Describe the task..."></textarea>
                </div>

                <div class="form-group">
                    <label for="points">Points</label>
                    <input type="number" id="points" name="points" value="10" min="0" required>
                </div>

                <button type="submit" class="btn btn-success btn-block">Create & Assign</button>
            </form>
        </div>
    </div>

    <div style="text-align: center; margin-top: 1rem;">
        <a href="/chores" class="btn btn-secondary">← Back to Tasks</a>
    </div>
</div>

<footer class="footer">
    <p>Family Chore Tracker &copy; 2024</p>
</footer>
</body>
</html>
