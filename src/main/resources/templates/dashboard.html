<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar">
    <div class="nav-container">
        <a href="/dashboard" class="nav-brand">🏠 Family Chore Tracker</a>
        <div class="nav-menu">
            <a href="/dashboard">Dashboard</a>
            <a href="/planning">Planning</a>
            <a href="/family">Family</a>
            <a href="/reports">Reports</a>
            <a href="/review">Review</a>
            <form th:action="@{/logout}" method="post">
                <button type="submit">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="stats-grid">
        <div th:if="${showPoints}" class="stat-card" style="background: linear-gradient(135deg, #A8E6CF, #B5EAD7);">
            <div class="stat-value" th:text="${totalPoints}">0</div>
            <div class="stat-label">⭐ My Points</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" th:text="${pendingCount}">0</div>
            <div class="stat-label">📋 Pending Tasks</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" th:text="${user.role}"></div>
            <div class="stat-label">Role</div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h3>📋 My Tasks</h3>
        </div>
        <div th:each="chore : ${pendingChores}" class="task-item">
            <div class="task-info">
                <strong th:text="${chore.name}"></strong>
                <span class="task-points">⭐ <span th:text="${chore.points}"></span> pts</span>
                <p th:text="${chore.description}"></p>
            </div>
            <a th:href="'/timer?choreId=' + ${chore.id}" class="btn btn-success">▶ Start Timer</a>
        </div>
        <div th:if="${pendingChores.empty}" class="empty-state">
            🎉 No pending tasks. Great job!
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h3>Quick Actions</h3>
        </div>
        <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
            <a href="/chores/create" class="btn btn-primary">+ Create Task</a>
            <a href="/planning" class="btn btn-secondary">📅 Weekly Plan</a>
            <a href="/family" class="btn btn-secondary">👨‍👩‍👧 Family</a>
        </div>
    </div>
</div>
</body>
</html>
