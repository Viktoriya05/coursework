# Application Configuration
spring.application.name=family-tracker
server.port=8080

# Database Configuration - MySQL (XAMPP)
# XAMPP MySQL ?? ?????????: ???? 3306, ???????????? root, ?????? ??????
spring.datasource.url=jdbc:mysql://localhost:3306/family_tracker?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Messages (i18n)
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=true

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.example.coursework=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# File uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB